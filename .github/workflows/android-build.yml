name: AFRO CITY Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AFRO-MOBILE-source-for-github.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract launcher source archive
        run: |
          test -f AFRO-MOBILE-source-for-github.zip
          mkdir -p /tmp/afro-mobile-source
          unzip -q AFRO-MOBILE-source-for-github.zip -d /tmp/afro-mobile-source
          cp -a /tmp/afro-mobile-source/. .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;21.4.7075529" "build-tools;31.0.0" "platforms;android-33"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare environment
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AFRO-CITY-SAMP-Launcher-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
